<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harness Report · HRP v1</title>

<!-- Source Sans 3 (UI) + Source Code Pro (code) — humanist sans stays legible at 11px -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* ════════════════════════════════════════════════════════════
     HRP · Harness Report Protocol · v1 template
     Single column, single theme, flat surface, no decoration.
     ════════════════════════════════════════════════════════════ */

  /* ── Theme tokens ─────────────────────────────────────────── */
  /* Two themes sharing the same token names:
       default → pure white canvas, cool grays, indigo accent
       dark    → near-black canvas, light text, indigo accent (slightly brighter)
     Status badges: tinted bg + colored text in both themes.            */

  [data-theme="default"] {
    /* Surfaces — pure white */
    --bg:           #ffffff;
    --bg-alt:       #f4f4f5;   /* quiet alt row for neutral tags */

    /* Rules */
    --rule:         #e5e7eb;
    --rule-strong:  #c9c6bd;

    /* Text — high contrast, ~17:1 on pure white */
    --text:         #0f172a;   /* slate-900 */
    --text-dim:     #475569;   /* slate-600 */
    --text-faint:   #64748b;   /* slate-500 — AA normal-text on white (4.54:1) */

    /* Accent — indigo, used for links/paths/focus */
    --accent:       #4338ca;
    --accent-bg:    #eef2ff;   /* for the active toggle button */

    /* Status — tuned for pure white */
    --success:      #15803d;
    --success-bg:   #dcfce7;
    --warn:         #b45309;
    --warn-bg:      #fef3c7;
    --error:        #b91c1c;
    --error-bg:     #fee2e2;
    --info:         #1d4ed8;
    --info-bg:      #dbeafe;

    /* Payload block (raw output) — dark on both themes */
    --payload-bg:   #0f172a;
    --payload-text: #f1f5f9;
  }

  [data-theme="dark"] {
    /* Surfaces — near-black, with a subtle warm tint to avoid pure #000 */
    --bg:           #0b0d12;   /* deep canvas */
    --bg-alt:       #161922;   /* quiet alt row for neutral tags */

    /* Rules */
    --rule:         #232734;
    --rule-strong:  #2f3445;

    /* Text — light on dark, AA-compliant */
    --text:         #e6e8ee;
    --text-dim:     #a8aebd;
    --text-faint:  #94a3b8;   /* slate-400 — AA normal-text on dark bg (4.95:1) */

    /* Accent — slightly brighter indigo for dark mode */
    --accent:       #818cf8;
    --accent-bg:    #1e1b4b;

    /* Status — saturated colors + deep tinted backgrounds */
    --success:      #4ade80;   /* green-400 — pops on dark */
    --success-bg:   #052e1a;
    --warn:         #fbbf24;   /* amber-400 */
    --warn-bg:      #3a2407;
    --error:        #f87171;   /* red-400 */
    --error-bg:     #3a0d0d;
    --info:         #60a5fa;   /* blue-400 */
    --info-bg:      #0c2447;

    /* Payload block stays dark with subtle lift */
    --payload-bg:   #050810;
    --payload-text: #e6e8ee;
  }

  html, body {
    font-family: 'Source Sans 3', 'Inter', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
    color: var(--text);
    background: var(--bg);
    transition: background-color 200ms ease, color 200ms ease;
  }

  body { font-size: 16px; line-height: 1.55; }

  /* ── Typography ───────────────────────────────────────────── */
  h1, h2, h3, h4 {
    font-weight: 600;
    line-height: 1.25;
    letter-spacing: -0.01em;
  }
  .page-title {
    font-size: 1.875rem;
    font-weight: 700;
    letter-spacing: -0.015em;
    line-height: 1.2;
    color: var(--text);
    margin: 0;
  }
  .section-title {
    font-size: 1rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin: 0 0 12px;
  }
  .item-title {
    font-size: 1.0625rem;
    font-weight: 600;
    color: var(--text);
    margin: 0;
  }
  p, li { line-height: 1.55; }

  code, .mono, .path, .cmd {
    font-family: 'Source Code Pro', 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    font-size: 13.5px;
    font-weight: 500;
  }

  /* ── Layout ───────────────────────────────────────────────── */
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 56px 24px 96px;
  }

  /* ── Header ───────────────────────────────────────────────── */
  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 32px;
  }
  .brand {
    font-size: 0.9375rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-faint);
  }
  .brand .name { color: var(--text-dim); }
  .actions {
    display: flex;
    gap: 14px;
    align-items: center;
  }
  .actions button {
    background: none;
    border: 0;
    padding: 0;
    color: var(--text-dim);
    font-size: 0.8125rem;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: var(--rule-strong);
  }
  .actions button:hover {
    color: var(--text);
    text-decoration-color: var(--accent);
  }
  .actions button:disabled {
    cursor: not-allowed;
    opacity: 0.4;
    text-decoration-color: var(--rule);
  }
  .actions button:disabled:hover {
    color: var(--text-dim);
    text-decoration-color: var(--rule);
  }
  /* Destructive action — clear color cue that this wipes files */
  .actions button.danger {
    color: var(--failed, #b91c1c);
    text-decoration-color: rgba(185, 28, 28, 0.35);
  }
  .actions button.danger:hover {
    color: var(--failed, #b91c1c);
    text-decoration-color: var(--failed, #b91c1c);
  }
  [data-theme="dark"] .actions button.danger {
    color: #f87171;
    text-decoration-color: rgba(248, 113, 113, 0.35);
  }
  [data-theme="dark"] .actions button.danger:hover {
    color: #fca5a5;
    text-decoration-color: #fca5a5;
  }
  .actions button.danger.confirmed {
    color: var(--text-dim);
    text-decoration: line-through;
    text-decoration-color: var(--rule-strong);
    cursor: default;
  }
  /* Theme toggle — no underline, just the icon */
  #btn-theme {
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    line-height: 1;
    padding: 0;
    color: var(--text-dim);
  }
  #btn-theme:hover { color: var(--text); }
  .theme-icon {
    display: inline-block;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    box-shadow: inset -5px -5px 0 0 currentColor;
    transition: box-shadow 150ms ease;
  }
  /* In dark mode show a sun (we're in dark → click to go light) */
  [data-theme="dark"] #btn-theme .theme-icon {
    box-shadow: inset 5px 5px 0 0 currentColor;
  }

  /* ── Title block ──────────────────────────────────────────── */
  .title-block {
    margin-bottom: 32px;
  }
  .title-block .status {
    display: inline-block;
    font-family: 'Source Code Pro', 'JetBrains Mono', ui-monospace, monospace;
    font-size: 0.6875rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 2px 8px;
    margin-bottom: 12px;
    border-radius: 3px;
  }
  .title-block .subtitle {
    font-size: 1.0625rem;
    color: var(--text-dim);
    margin: 8px 0 0;
    max-width: 60ch;
  }

  /* ── Meta row (top of report) ─────────────────────────────── */
  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    align-items: baseline;
    margin-bottom: 40px;
    font-family: 'Source Code Pro', 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11.5px;
    color: var(--text-dim);
  }
  .meta-row .cell { display: inline-flex; gap: 6px; align-items: baseline; }
  .meta-row .k {
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 12.5px;
  }
  .meta-row .v { color: var(--text); }

  /* ── Sections ─────────────────────────────────────────────── */
  .section {
    margin-bottom: 48px;
  }
  .section-body { display: flex; flex-direction: column; gap: 0; }

  /* ── Items (rows) ─────────────────────────────────────────── */
  .item,
  .empty,
  details.group-bullet > summary {
    padding: 14px 0;
    border-top: 1px solid var(--rule);
  }
  .section-body > *:first-child { border-top: 0; padding-top: 0; }
  .item:last-child { border-bottom: 1px solid var(--rule); }

  .item-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .item-head .label {
    font-family: 'Source Code Pro', 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12.5px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 1px 6px;
    border-radius: 3px;
    background: var(--bg-alt);
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .label-success,
  .status[data-kind="success"] { background: var(--success-bg); color: var(--success); }
  .label-warn,
  .status[data-kind="warn"]    { background: var(--warn-bg);    color: var(--warn); }
  .label-error,
  .status[data-kind="failed"]  { background: var(--error-bg);   color: var(--error); }
  .label-info,
  .status[data-kind="info"]    { background: var(--info-bg);    color: var(--info); }
  .label-neutral,
  .status[data-kind="noop"],
  .status                     { background: var(--bg-alt);     color: var(--text-dim); }
  .status-noop                  { background: var(--bg-alt);     color: var(--text-faint); }
  .status-partial               { background: var(--warn-bg);    color: var(--warn); }
  .status-failed                { background: var(--error-bg);   color: var(--error); }
  .status-success               { background: var(--success-bg); color: var(--success); }

  .item-detail {
    margin: 6px 0 0;
    color: var(--text-dim);
    font-size: 1.0625rem;
    line-height: 1.55;
  }
  .item-detail.mono {
    font-family: 'Source Code Pro', 'JetBrains Mono', ui-monospace, monospace;
    font-size: 13.5px;
    color: var(--text);
  }

  /* File path rows */
  .file-row .path {
    color: var(--accent);
    word-break: break-all;
  }
  .file-row .meta {
    margin-left: auto;
    font-family: 'Source Code Pro', 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    color: var(--text-faint);
  }
  .file-row .meta .plus  { color: var(--success); }
  .file-row .meta .minus { color: var(--error); }

  /* Decision rows */
  .decision-row .tradeoffs {
    margin: 10px 0 0;
    padding: 0;
    list-style: none;
    display: grid;
    grid-template-columns: 1fr;
    gap: 4px;
  }
  .decision-row .tradeoffs li {
    font-size: 0.875rem;
    padding-left: 16px;
    position: relative;
    color: var(--text-dim);
  }
  .decision-row .tradeoffs li::before {
    content: attr(data-mark);
    position: absolute;
    left: 0;
    color: var(--text-faint);
    font-family: 'Source Code Pro', 'JetBrains Mono', ui-monospace, monospace;
    font-weight: 600;
  }
  .decision-row .tradeoffs li.pro::before { color: var(--success); }
  .decision-row .tradeoffs li.con::before { color: var(--error); }

  /* Error rows */
  .error-row {
    border-left: 2px solid var(--error);
    padding-left: 14px;
  }
  .error-row.warn { border-left-color: var(--warn); }
  .error-row.info { border-left-color: var(--info); }

  /* Command rows */
  .command-row .cmd-line {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .command-row .cmd-text {
    flex: 1 1 auto;
    min-width: 0;
    word-break: break-all;
    color: var(--text);
  }
  .command-row .exit {
    font-family: 'Source Code Pro', 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    color: var(--text-dim);
    padding: 1px 6px;
    border-radius: 3px;
    background: var(--bg-alt);
    flex-shrink: 0;
  }
  .command-row .exit.ok    { background: var(--success-bg); color: var(--success); }
  .command-row .exit.bad   { background: var(--error-bg);   color: var(--error); }
  .command-row .duration {
    font-family: 'Source Code Pro', 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    color: var(--text-faint);
    margin-left: auto;
  }
  .command-row .note {
    margin: 6px 0 0;
    color: var(--text-faint);
    font-size: 0.85rem;
    font-style: italic;
  }

  /* Grouped files (density) */
  details.group-bullet { margin: 0; }
  details.group-bullet > summary {
    list-style: none;
    cursor: pointer;
  }
  details.group-bullet > summary::-webkit-details-marker { display: none; }
  details.group-bullet > summary::marker { content: ''; }
  .group-summary {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .group-summary .count {
    font-family: 'Source Code Pro', 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 1px 6px;
    border-radius: 3px;
    background: var(--bg-alt);
    color: var(--text-dim);
  }
  .group-summary .dir {
    font-family: 'Source Code Pro', 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12.5px;
    color: var(--accent);
  }
  .group-summary .breakdown {
    font-size: 0.85rem;
    color: var(--text-dim);
  }
  .group-summary .chev {
    margin-left: auto;
    font-family: 'Source Code Pro', 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    color: var(--text-faint);
  }
  details.group-bullet[open] > summary .chev::before { content: '▾'; }
  details.group-bullet:not([open]) > summary .chev::before { content: '▸'; }
  .group-inner {
    padding: 0 0 8px 14px;
    border-left: 1px solid var(--rule);
    margin-left: 6px;
  }

  /* ── Payload (raw output ONLY) ────────────────────────────── */
  .payload {
    margin-top: 10px;
    background: var(--payload-bg);
    color: var(--payload-text);
    border-radius: 6px;
    padding: 12px 14px;
    overflow-x: auto;
    font-family: 'Source Code Pro', 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .payload::-webkit-scrollbar { height: 6px; }
  .payload::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }

  /* ── Empty state ──────────────────────────────────────────── */
  .empty {
    border-bottom: 1px solid var(--rule);
    color: var(--text-faint);
    font-size: 0.875rem;
    font-style: italic;
  }

  /* ── Stats (definition list, inline) ──────────────────────── */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px 24px;
    margin: 20px 0 0;
    padding: 16px 0 4px;
    border-top: 1px solid var(--rule);
  }
  .stats .stat { display: flex; flex-direction: column; gap: 2px; }
  .stats .stat .k {
    font-size: 0.875rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
  }
  .stats .stat .v {
    font-family: 'Source Code Pro', 'JetBrains Mono', ui-monospace, monospace;
    font-size: 1rem;
    font-weight: 500;
    color: var(--text);
  }

  /* ── Sources (provenance pills, optional) ─────────────────── */
  .sources {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 8px;
    align-items: center;
    margin: 16px 0 0;
    padding: 12px 0 0;
    border-top: 1px solid var(--rule);
  }
  .sources[hidden] { display: none; }
  .sources .source-pill {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    padding: 3px 8px;
    border-radius: 3px;
    background: var(--bg-alt);
    color: var(--text);
    font-size: 0.8125rem;
    line-height: 1.3;
    border: 1px solid var(--rule);
  }
  .sources .source-pill[data-kind="file"]      { background: var(--accent-bg); border-color: transparent; }
  .sources .source-pill[data-kind="pasted"]    { background: var(--info-bg);    border-color: transparent; }
  .sources .source-pill[data-kind="transcript"]{ background: var(--bg-alt);     border-color: var(--rule); }
  .sources .source-kind {
    font-family: 'Source Code Pro', 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
  }
  .sources .source-ref {
    font-family: 'Source Code Pro', 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px;
    color: var(--text);
    text-decoration: none;
    max-width: 360px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  a.source-ref:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .sources .source-bytes {
    font-family: 'Source Code Pro', 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px;
    color: var(--text-faint);
  }

  /* ── Density banner ───────────────────────────────────────── */
  .density-note {
    display: flex;
    gap: 8px;
    align-items: baseline;
    font-size: 0.8125rem;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .density-note .marker {
    font-family: 'Source Code Pro', 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 1px 6px;
    border-radius: 3px;
    background: var(--info-bg);
    color: var(--info);
  }
  .density-note .marker.warn { background: var(--warn-bg); color: var(--warn); }

  /* ── Validation banner ────────────────────────────────────── */
  .validation-banner {
    background: var(--error-bg);
    color: var(--error);
    padding: 12px 16px;
    border-radius: 6px;
    margin-bottom: 32px;
    font-size: 0.875rem;
  }
  .validation-banner h4 {
    font-size: 0.875rem;
    margin: 0 0 6px;
    color: var(--error);
  }
  .validation-banner ul { margin: 4px 0 0 18px; padding: 0; }
  .validation-banner li { margin: 2px 0; }

  /* ── Toast ────────────────────────────────────────────────── */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--payload-bg);
    color: var(--payload-text);
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 0.8125rem;
    transition: transform 200ms ease;
    z-index: 100;
    pointer-events: none;
    opacity: 0;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* ── Focus rings (a11y) ───────────────────────────────────── */
  a:focus-visible,
  summary:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ── Responsive ───────────────────────────────────────────── */
  @media (max-width: 640px) {
    .wrap { padding: 32px 18px 64px; }
    .topbar { flex-direction: column; align-items: flex-start; gap: 12px; }
    .meta-row { font-size: 11px; }
  }

  /* ── Text selection ───────────────────────────────────────── */
  ::selection { background: rgba(67, 56, 202, 0.18); color: var(--text); }
</style>
</head>

<body>

<div class="wrap">

  <!-- ─── TOP BAR ─────────────────────────────────────────── -->
  <div class="topbar">
    <div class="brand"><span class="name">Harness Report</span> · HRP v1</div>
    <div class="actions">
      <button id="btn-theme" type="button" aria-label="Toggle theme" title="Toggle light/dark">
        <span class="theme-icon" aria-hidden="true"></span>
      </button>
      <button id="btn-view-json" type="button">View JSON</button>
      <button id="btn-copy-json" type="button">Copy JSON</button>
      <button id="btn-download-html" type="button">Download HTML</button>
      <button id="btn-clean-disk" type="button" class="danger" disabled title="Wipe this report's files from disk">Clean from Disk</button>
    </div>
  </div>

  <!-- ─── TITLE BLOCK ─────────────────────────────────────── -->
  <div class="title-block">
    <span id="report-status" class="status">—</span>
    <h1 id="report-title" class="page-title">Loading…</h1>
    <p id="report-subtitle" class="subtitle"></p>
  </div>

  <!-- ─── META ROW ────────────────────────────────────────── -->
  <div id="report-meta" class="meta-row"></div>

  <!-- ─── SECTIONS ────────────────────────────────────────── -->
  <main id="main-content">

    <!-- 01 · Overview -->
    <section class="section" id="overview">
      <h2 class="section-title">Overview</h2>
      <div id="overview-body" class="section-body"></div>
      <div id="overview-sources" class="sources" hidden></div>
      <dl id="overview-stats" class="stats"></dl>
    </section>

    <!-- 02 · Files -->
    <section class="section" id="files">
      <h2 class="section-title">Files Changed</h2>
      <div id="files-body" class="section-body"></div>
    </section>

    <!-- 03 · Decisions -->
    <section class="section" id="decisions">
      <h2 class="section-title">Decisions</h2>
      <div id="decisions-body" class="section-body"></div>
    </section>

<!-- Theme bootstrap: applies persisted choice (or OS preference) ASAP -->
<script>
  (function () {
    try {
      var saved = localStorage.getItem('hrp-theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved === 'dark' || saved === 'light' ? saved : (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) { /* localStorage may be blocked — fall back to default */ }
  })();
</script>

<!-- Theme toggle — switches data-theme and persists choice -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('btn-theme');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var current = document.documentElement.getAttribute('data-theme') || 'light';
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('hrp-theme', next); } catch (e) {}
    });
  });
</script>
